#------------------------------------------------------------------------------
# SPEC CPU(R) 2026 config for gcc/g++/gfortran on Linux x86 (Xeon server)
#------------------------------------------------------------------------------
#
# Usage: (1) Copy this to a new name
#             cd $SPEC/config
#             cp Example-x.cfg myname.cfg
#        (2) Change items that are marked 'EDIT' (search for it)
#
# SPEC tested this config file with:
#    Compiler version(s):    gcc 15.2
#    Operating system(s):    Linux (Ubuntu 22.04)
#    Hardware:               x86 Xeon (single-CPU server)
#
# If your system differs, this config file might not work.
# You might find a better config file at https://www.spec.org/cpu2026/results
#
# Unexpected errors?  Try using a newer version of the compiler
#                     or try reducing the optimization level.
#
# Compiler issues: Contact your compiler vendor, not SPEC.
# For SPEC help:   https://www.spec.org/cpu2026/Docs/techsupport.html
#------------------------------------------------------------------------------


#--------- Label --------------------------------------------------------------
%ifndef %{label}
   label   = mytest # EDIT
%else
   label   = %{label}
%endif


#--------- Preprocessor -------------------------------------------------------
%ifndef %{build_ncpus}         # EDIT to adjust number of simultaneous compiles.
%   define  build_ncpus 1      #      Or, you can set it on the command line:
%endif                         #      'runcpu --define build_ncpus=nn'


#--------- Global Settings ----------------------------------------------------

# 17 Logical Hardware Counter Groups for Intel Xeon (User-Space Only)
%if %{my_run} == 0
%   define my_events "{instructions,cpu-cycles,bus-cycles,fp_arith_inst_retired.scalar_single}:uS"
%elif %{my_run} == 1
%   define my_events "{instructions,branch-loads,branch-load-misses}:uS"
%elif %{my_run} == 2
%   define my_events "{instructions,br_inst_retired.all_branches,br_misp_retired.all_branches,ref-cycles}:uS"
%elif %{my_run} == 3
%   define my_events "{instructions,L1-dcache-loads,L1-dcache-load-misses,L1-dcache-stores}:uS"
%elif %{my_run} == 4
%   define my_events "{instructions,L1-icache-load-misses,LLC-loads,LLC-load-misses}:uS"
%elif %{my_run} == 5
%   define my_events "{instructions,cache-references,cache-misses,mem-loads}:uS"
%elif %{my_run} == 6
%   define my_events "{instructions,dTLB-loads,dTLB-load-misses,iTLB-load-misses}:uS"
%elif %{my_run} == 7
%   define my_events "{instructions,dTLB-stores,dTLB-store-misses,mem-stores}:uS"
%elif %{my_run} == 8
%   define my_events "{instructions,LLC-stores,LLC-store-misses,mem-loads-aux}:uS"
%elif %{my_run} == 9
%   define my_events "{instructions,branch-instructions,branch-misses,node-loads}:uS"
%elif %{my_run} == 10
%   define my_events "{instructions,node-load-misses,fp_arith_inst_retired.scalar_double}:uS"
%elif %{my_run} == 11
%   define my_events "{instructions,fp_arith_inst_retired.128b_packed_single,fp_arith_inst_retired.128b_packed_double,fp_arith_inst_retired.256b_packed_single}:uS"
%elif %{my_run} == 12
%   define my_events "{instructions,fp_arith_inst_retired.256b_packed_double,idq.dsb_uops,idq.mite_uops}:uS"
%elif %{my_run} == 13
%   define my_events "{instructions,idq_uops_not_delivered.core,uops_executed.thread}:uS"
%elif %{my_run} == 14
%   define my_events "{instructions,mem_inst_retired.all_loads,mem_inst_retired.all_stores}:uS"
%elif %{my_run} == 15
%   define my_events "{instructions}:u,page-faults:u,minor-faults:u,major-faults:u"
%elif %{my_run} == 16
%   define my_events "{instructions}:u,context-switches:u"
%endif

monitor_wrapper = count=\$(ls -1 ~/PerfCount/cpu_%{my_cpu}_%{my_freq}_spec_${benchmark}_10000000_%{my_run}_*.out 2>/dev/null | wc -l); perf record -e '%{my_events}' -c 10000000 --no-buffering -o ~/PerfCount/cpu_%{my_cpu}_%{my_freq}_spec_${benchmark}_10000000_%{my_run}_\$count.out -- $command


default:
   bench_post_setup     = sync
   command_add_redirect = 1
   flagsurl             = $[top]/config/flags/gcc.xml
   ignore_errors        = 1
   iterations           = 1
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,html,cfg,pdf,csv
   preenv               = 1
   reportable           = 0
   tune                 = base


#--------- How Many CPUs? -----------------------------------------------------
default:
   copies                 = 1       # EDIT to change number of copies
   threads                = 1       # EDIT to change number of threads


#------- Compilers ------------------------------------------------------------
default:
#  EDIT: The parent directory for your compiler.
#        Do not include the trailing /bin/
#        Do not include a trailing slash
#   Example: /usr/bin/gcc  ->  %define gcc_dir "/usr"
#
%ifndef %{gcc_dir}
%   define gcc_dir "/usr"
%endif

# EDIT: If your compiler version is less than 10, comment out
#       the next line to avoid compile errors for Fortran benchmarks
#
%define GCCge10  # EDIT: comment out if using GCC 9 or earlier

   preENV_LD_LIBRARY_PATH  = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64
  #preENV_LD_LIBRARY_PATH  = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64:%{ENV_LD_LIBRARY_PATH}
   SPECLANG                = %{gcc_dir}/bin/
# EDIT if needed: adjust to the GCC version installed on this machine
   CC                      = $(SPECLANG)gcc-15      -std=c18     -m64
   CXX                     = $(SPECLANG)g++-15      -std=c++17   -m64
   FC                      = $(SPECLANG)gfortran-15 -std=f2018   -m64
   CC_VERSION_OPTION       = --version
   CXX_VERSION_OPTION      = --version
   FC_VERSION_OPTION       = --version


#--------- Portability --------------------------------------------------------

800.pot3d_s:
  PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

710.omnetpp_r:
   PORTABILITY = -fno-finite-math-only

734.vpr_r,834.vpr_s:
   PORTABILITY = -fno-finite-math-only

735.gem5_r,835.gem5_s:
   PORTABILITY = -fno-finite-math-only

736.ocio_r:
   PORTABILITY = -fno-finite-math-only

737.gmsh_r:
   PORTABILITY = -fno-fast-math

748.flightdm_r:
   PORTABILITY = -fno-fast-math

753.ns3_r,853.ns3_s:
   PORTABILITY = -fno-finite-math-only

767.nest_r,867.nest_s:
   PORTABILITY = -fno-finite-math-only
   PORTABILITY_LIBS = -lstdc++fs


#----------------------------------------------------------------------
#       GCC workarounds that do not count as PORTABILITY
#----------------------------------------------------------------------
%ifdef %{GCCge10}
   default:
      EXTRA_FFLAGS = -fallow-argument-mismatch
%endif

#-------- Tuning Flags common to Base and Peak --------------------------------
intspeed,fpspeed:
   preENV_OMP_STACKSIZE = 120M
doconcurrent:
   EXTRA_FOPTIMIZE = -ftree-parallelize-loops=8  # EDIT for thread count
openmp:
   EXTRA_OPTIMIZE  = -fopenmp -DSPEC_OPENMP
cxxthreads:
   EXTRA_OPTIMIZE  = -pthread

#--------  Base Tuning Flags ----------------------------------------------
default=base:
   OPTIMIZE       = -g -O3 -march=native


#--------  Peak Tuning Flags ----------------------------------------------
default:
   basepeak = yes
default=peak:


#------------------------------------------------------------------------------
# Tester and System Descriptions - EDIT all sections below this point
#------------------------------------------------------------------------------

default:
   sw_compiler001   = C/C++/Fortran: Version 15.2.0 of GCC, the
   sw_compiler002   = GNU Compiler Collection
   sw_compiler_category = Community
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = Not Applicable

default:
   hw_vendor          = My Corporation
   tester             = My Corporation
   test_sponsor       = My Corporation
   license_num        = nnn (Your SPEC license number)

default:
   hw_avail           = # Nov-2099
   sw_avail           = # Nov-2099
   fw_bios            = # Version Mumble released May-2099

default:
   hw_cpu_name        = # Intel Xeon
   hw_cpu_nominal_mhz = # 9999
   hw_cpu_max_mhz     = # 9999
   hw_storage         = # 9 x 9 TB SATA III 9999 RPM
   hw_model           = # TurboBlaster 3000
   hw_nchips          = # 1
   hw_ncores          = # 9999
   hw_ncpuorder       = # 1 chip
   hw_nthreadspercore = # 9
   hw_cooling         = Air
   hw_other           = # None

   hw_memory001       = # 999 GB (99 x 9 GB 2Rx4 PC4-2133P-R,
   hw_memory002       = # running at 1600 MHz)

   hw_pcache          = # 99 KB I + 99 KB D on chip per core
   hw_scache          = # 99 KB I+D on chip per 9 cores
   hw_tcache          = # 9 MB I+D on chip per chip
   hw_ocache          = # 9 GB I+D off chip per system board

   sw_file            = # ext4
   sw_os001           = # Linux Ubuntu 22.04
   sw_os002           = # LTS
   sw_other           = # None
   sw_state           = # Run level 3
   power_management   = # briefly summarize power settings

