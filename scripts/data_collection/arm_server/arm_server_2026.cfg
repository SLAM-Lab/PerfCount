#------------------------------------------------------------------------------
# SPEC CPU(R) 2026 config for gcc/g++/gfortran on Linux Arm
#------------------------------------------------------------------------------
#
# Usage: (1) Copy this to a new name
#             cd $SPEC/config
#             cp Example-x.cfg myname.cfg
#        (2) Change items that are marked 'EDIT' (search for it)
#
# SPEC tested this config file with:
#    Compiler version(s):    gcc 15.2
#    Operating system(s):    Linux (Fedora 42)
#    Hardware:               ARMv8-A (Neoverse-N1)
#
# If your system differs, this config file might not work.
# You might find a better config file at https://www.spec.org/cpu2026/results
#
# Compiler notes
#
#   Please use the newest GCC that you can. The default version packaged with
#   your operating system may be very old; look for alternate packages with a
#   newer version.
#   Example 1: on Red Hat systems, you may be able to
#                dnf install gcc-toolset-15
#              and then before running SPEC CPU, start a new shell with
#                scl enable gcc-toolset-15 bash
#   Example 2: on Ubuntu systems, you may be able to
#                apt install gcc-14 g++-14 gfortran-14
#              and then adjust the variables CC, CXX, and FC below.
#
# Unexpected errors?  Try using a newer version of the compiler
#                     or try reducing the optimization level,
#
# Compiler issues: Contact your compiler vendor, not SPEC.
# For SPEC help:   https://www.spec.org/cpu2026/Docs/techsupport.html
#------------------------------------------------------------------------------


#--------- Label --------------------------------------------------------------
# Arbitrary alphanumeric string to tag binaries and directories.
# More info: https://www.spec.org/cpu2026/Docs/config.html#label
# Two suggestions:
#                 (1) EDIT the label as you try new ideas.
#                 (2)      Use a label meaningful to *you*.
%ifndef %{label}
   label   = mytest # EDIT
%else
   label   = %{label}
%endif


#--------- Preprocessor -------------------------------------------------------
%ifndef %{build_ncpus}         # EDIT to adjust number of simultaneous compiles.
%   define  build_ncpus 8      #      Or, you can set it on the command line:
%endif                         #      'runcpu --define build_ncpus=nn'

# Decode the my_run flag to determine which counter group to collect (Max 4 per group)
%if %{my_run} == 0
%   define my_events "{instructions,cpu-cycles,stalled-cycles-backend,stalled-cycles-frontend}:Su"
%elif %{my_run} == 1
%   define my_events "{instructions,armv8_pmuv3_0/br_pred/,armv8_pmuv3_0/br_mis_pred/,L1-dcache-loads}:Su"
%elif %{my_run} == 2
%   define my_events "{instructions,L1-dcache-load-misses,armv8_pmuv3_0/l1d_cache/,armv8_pmuv3_0/l1d_cache_refill/}:Su"
%elif %{my_run} == 3
%   define my_events "{instructions,armv8_pmuv3_0/l1d_cache_wb/,L1-icache-loads,L1-icache-load-misses}:Su"
%elif %{my_run} == 4
%   define my_events "{instructions,armv8_pmuv3_0/l1i_cache/,armv8_pmuv3_0/l1i_cache_refill/,armv8_pmuv3_0/l2d_cache/}:Su"
%elif %{my_run} == 5
%   define my_events "{instructions,armv8_pmuv3_0/l2d_cache_refill/,armv8_pmuv3_0/l2d_cache_wb/,cache-references}:Su"
%elif %{my_run} == 6
%   define my_events "{instructions,cache-misses,armv8_pmuv3_0/l1d_cache_rd/,armv8_pmuv3_0/l1d_cache_wr/}:Su"
%elif %{my_run} == 7
%   define my_events "{instructions,armv8_pmuv3_0/l2d_cache_rd/,armv8_pmuv3_0/l2d_cache_wr/,armv8_pmuv3_0/bus_access/}:Su"
%elif %{my_run} == 8
%   define my_events "{instructions,armv8_pmuv3_0/mem_access/,armv8_pmuv3_0/memory_error/,armv8_pmuv3_0/exc_return/}:Su"
%elif %{my_run} == 9
%   define my_events "{instructions,armv8_pmuv3_0/l3d_cache/,armv8_pmuv3_0/l3d_cache_refill/}:Su"
%elif %{my_run} == 10
%   define my_events "{instructions,armv8_pmuv3_0/l1d_tlb/,armv8_pmuv3_0/l1d_tlb_refill/,armv8_pmuv3_0/l2d_tlb/}:Su"
%elif %{my_run} == 11
%   define my_events "{instructions,armv8_pmuv3_0/l2d_tlb_refill/,armv8_pmuv3_0/l1i_tlb/,armv8_pmuv3_0/l1i_tlb_refill/}:Su"
%elif %{my_run} == 12
%   define my_events "{instructions,armv8_pmuv3_0/ld_spec/,armv8_pmuv3_0/st_spec/,armv8_pmuv3_0/dp_spec/}:Su"
%elif %{my_run} == 13
%   define my_events "{instructions,armv8_pmuv3_0/ase_spec/,armv8_pmuv3_0/vfp_spec/,armv8_pmuv3_0/pc_write_spec/}:Su"
%elif %{my_run} == 14
%   define my_events "{instructions,armv8_pmuv3_0/br_immed_spec/,armv8_pmuv3_0/br_return_spec/,armv8_pmuv3_0/br_indirect_spec/}:Su"
%elif %{my_run} == 15
%   define my_events "{instructions,armv8_pmuv3_0/br_retired/,armv8_pmuv3_0/br_mis_pred_retired/,armv8_pmuv3_0/unaligned_ld_spec/}:Su"
%elif %{my_run} == 16
%   define my_events "{instructions,armv8_pmuv3_0/isb_spec/,armv8_pmuv3_0/dsb_spec/,armv8_pmuv3_0/dmb_spec/}:Su"
%elif %{my_run} == 17
%   define my_events "{instructions,armv8_pmuv3_0/exc_taken/,armv8_pmuv3_0/ttbr_write_retired/,armv8_pmuv3_0/cid_write_retired/}:Su"
%elif %{my_run} == 18
%   define my_events "{instructions,armv8_pmuv3_0/l1d_cache_refill_rd/,armv8_pmuv3_0/l1d_cache_refill_wr/,armv8_pmuv3_0/l3d_cache_rd/}:Su"
%endif


#--------- Global Settings ----------------------------------------------------
# For info, see:
#            https://www.spec.org/cpu2026/Docs/config.html#fieldname
#   Example: https://www.spec.org/cpu2026/Docs/config.html#tune

default:
   monitor_wrapper      = count=\$(ls -1 /home/meb4744/PerfCount/cpu_%{my_cpu}_%{my_freq}_spec_${benchmark}_10000000_%{my_run}_*.out 2>/dev/null | wc -l); perf record -e %{my_events} -c 10000000 --no-buffering -o /home/meb4744/PerfCount/cpu_%{my_cpu}_%{my_freq}_spec_${benchmark}_10000000_%{my_run}_\$count.out -- $command
   bench_post_setup     = sync
   command_add_redirect = 1
   flagsurl             = $[top]/config/flags/gcc.xml
   ignore_errors        = 1
   iterations           = 1
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,html,cfg,pdf,csv
   preenv               = 1
   reportable           = 0
   tune                 = base


#--------- How Many CPUs? -----------------------------------------------------
# Both SPECrate and SPECspeed can test multiple chips / cores / hw threads
#    - For SPECrate,  you set the number of copies.
#    - For SPECspeed, you set the number of threads.
# See: https://www.spec.org/cpu2026/Docs/system-requirements.html#MultipleCPUs
#
#    q. How many should I set?
#    a. Unknown, you will have to try it and see!
#
# To get you started, some suggestions:
#
#     copies - This config file defaults to testing only 1 copy.   You might
#              try changing it to match the number of cores on your system,
#              or perhaps the number of virtual CPUs as reported by:
#                     grep -c processor /proc/cpuinfo
#              Be sure you have enough memory.  See:
#              https://www.spec.org/cpu2026/Docs/system-requirements.html#memory
#
#     threads - This config file sets a starting point, which you can adjust.
#
default:
   copies                 = 1       # EDIT to change number of copies (see above)
   threads                = 1       # EDIT to change number of threads (see above)


#------- Compilers ------------------------------------------------------------
default:
#  EDIT: The parent directory for your compiler.
#        Do not include the trailing /bin/
#        Do not include a trailing slash
#  Examples:
#   1  On a Red Hat system, you said:  dnf install gcc-toolset-15
#      Use:            %   define gcc_dir "/opt/rh/gcc-toolset-15/root/usr"
#
#   2  You built GCC in:                   /home/john/gcc-15.2.0/bin/gcc
#      Use:            %   define gcc_dir "/home/john/gcc-15.2.0"
#
#   3  You want:                           /usr/bin/gcc
#      Use:            %   define gcc_dir "/usr"
#      WARNING: The system GCC may be too old to work with this benchmark suite.
#               See "Compiler notes", above.
#
%ifndef %{gcc_dir}
%   define gcc_dir "/usr"
%endif

# EDIT: If your compiler version is less than 10, comment out
#       the next line to avoid compile errors for Fortran benchmarks
#
%define GCCge10  # EDIT: comment out if using GCC 9 or earlier

# EDIT if needed: the preENV line adds library directories to the runtime
#      path.  You can adjust it, or add lines for other environment variables.
#      See: https://www.spec.org/cpu2026/Docs/config.html#preenv
#      and: https://gcc.gnu.org/onlinedocs/gcc/Environment-Variables.html
   preENV_LD_LIBRARY_PATH  = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64
  #preENV_LD_LIBRARY_PATH  = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64:%{ENV_LD_LIBRARY_PATH}
   SPECLANG                = %{gcc_dir}/bin/
# EDIT if needed: you may want to use a different compiler (e.g. gcc-15).
   CC                      = $(SPECLANG)gcc      -std=c18     
   CXX                     = $(SPECLANG)g++      -std=c++17   
   FC                      = $(SPECLANG)gfortran -std=f2018   
   # How to say "Show me your version, please"
   CC_VERSION_OPTION       = --version
   CXX_VERSION_OPTION      = --version
   FC_VERSION_OPTION       = --version


#--------- Portability --------------------------------------------------------

800.pot3d_s:
  PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

710.omnetpp_r:
   PORTABILITY = -fno-finite-math-only

734.vpr_r,834.vpr_s:
   PORTABILITY = -fno-finite-math-only

735.gem5_r,835.gem5_s:
   PORTABILITY = -fno-finite-math-only

736.ocio_r:
   PORTABILITY = -fno-finite-math-only

737.gmsh_r:
   PORTABILITY = -fno-fast-math

748.flightdm_r:
   PORTABILITY = -fno-fast-math

753.ns3_r,853.ns3_s:
   PORTABILITY = -fno-finite-math-only

767.nest_r,867.nest_s:
   PORTABILITY = -fno-finite-math-only
   PORTABILITY_LIBS = -lstdc++fs


#----------------------------------------------------------------------
#       GCC workarounds that do not count as PORTABILITY
#----------------------------------------------------------------------
# The workarounds in this section would not qualify under the SPEC CPU
# PORTABILITY rule.
#   - In peak, they can be set as needed for individual benchmarks.
#   - In base, individual settings are not allowed; set for whole suite.
# See:
#     https://www.spec.org/cpu2026/Docs/runrules.html#portability
#     https://www.spec.org/cpu2026/Docs/runrules.html#BaseFlags
#
%ifdef %{GCCge10}
   default:
      EXTRA_FFLAGS = -fallow-argument-mismatch
%endif

#-------- Tuning Flags common to Base and Peak --------------------------------
#
# Speed (OpenMP and Autopar allowed)
#
intspeed,fpspeed:
   preENV_OMP_STACKSIZE = 120M
doconcurrent:
   EXTRA_FOPTIMIZE = -ftree-parallelize-loops=8  # EDIT for how many threads you want to use
openmp:
   EXTRA_OPTIMIZE  = -fopenmp -DSPEC_OPENMP
cxxthreads:
   EXTRA_OPTIMIZE  = -pthread
   # https://gcc.gnu.org/onlinedocs/gcc-15.1.0/libstdc++/manual/manual/using_concurrency.html

#--------  Base Tuning Flags ----------------------------------------------
# EDIT if needed -- If you run into errors, you may need to reduce the
#                   optimization.
#
default=base:         # flags for all base
   OPTIMIZE       = -g -O3 -mcpu=native


#--------  Peak Tuning Flags ----------------------------------------------
default:           # If you develop some peak tuning, remove these two lines
   basepeak = yes  # and put your tuning in the default=peak: section below.
default=peak:


#------------------------------------------------------------------------------
# Tester and System Descriptions - EDIT all sections below this point
#------------------------------------------------------------------------------
#   For info about any field, see
#             https://www.spec.org/cpu2026/Docs/config.html#fieldname
#   Example:  https://www.spec.org/cpu2026/Docs/config.html#hw_memory
#-------------------------------------------------------------------------------

#--------- EDIT to match your version -----------------------------------------
default:
   sw_compiler001   = C/C++/Fortran: Version 15.2.1 of GCC, the
   sw_compiler002   = GNU Compiler Collection
   sw_compiler_category = Community
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = Not Applicable

#--------- EDIT info about you ------------------------------------------------
# To understand the difference between hw_vendor/sponsor/tester, see:
#     https://www.spec.org/cpu2026/Docs/config.html#test_sponsor
default:
   hw_vendor          = My Corporation
   tester             = My Corporation
   test_sponsor       = My Corporation
   license_num        = nnn (Your SPEC license number)
#  prepared_by        = # Ima Pseudonym                       # Whatever you like: is never output


#--------- EDIT system availability dates -------------------------------------
default:
                        # Example                             # Brief info about field
   hw_avail           = # Nov-2099                            # Date of LAST hardware component to ship
   sw_avail           = # Nov-2099                            # Date of LAST software component to ship
   fw_bios            = # Version Mumble released May-2099    # Firmware information

#--------- EDIT system information --------------------------------------------
default:
                        # Example                             # Brief info about field
   hw_cpu_name        = # Ampere AmpereOne A999-99X           # chip name
   hw_cpu_nominal_mhz = # 9999                                # Nominal chip frequency, in MHz
   hw_cpu_max_mhz     = # 9999                                # Max chip frequency, in MHz
   hw_storage         = # 9 x 9 TB SATA III 9999 RPM          # Size, type, other perf-relevant info
   hw_model           = # TurboBlaster 3000                   # system model name
   hw_nchips          = # 99                                  # number chips enabled
   hw_ncores          = # 9999                                # number cores enabled
   hw_ncpuorder       = # 1-9 chips                           # Ordering options
   hw_nthreadspercore = # 9                                   # number threads enabled per core
   hw_cooling         = Air                                   # Air, CLC, DLC, or Other
   hw_other           = # TurboNUMA Router 10 Gb              # Other perf-relevant hw, or "None"

   hw_memory001       = # 999 GB (99 x 9 GB 2Rx4 PC4-2133P-R, # The 'PCn-etc' is from the JEDEC
   hw_memory002       = # running at 1600 MHz)                # label on the DIMM.

   hw_pcache          = # 99 KB I + 99 KB D on chip per core  # Primary cache size, type, location
   hw_scache          = # 99 KB I+D on chip per 9 cores       # Second cache or "None"
   hw_tcache          = # 9 MB I+D on chip per chip           # Third  cache or "None"
   hw_ocache          = # 9 GB I+D off chip per system board  # Other cache or "None"

   sw_file            = # ext99                               # File system
   sw_os001           = # Linux Sailboat                      # Operating system
   sw_os002           = # Distribution 7.2 SP1                # and version
   sw_other           = # TurboHeap Library V8.1              # Other perf-relevant sw, or "None"
   sw_state           = # Run level 99                        # Software state.

   power_management   = # briefly summarize power settings

